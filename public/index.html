<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>근거 기반 자료 검증기</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="badge">FREE • EVIDENCE CHECK</div>
      <h1>근거 기반 자료 검증기</h1>
      <p>자료를 넣으면 핵심 주장과 관련 근거를 찾아서 <b>왜 그렇게 판단했는지</b> 보여줍니다.</p>
    </header>

    <section class="card">
      <label for="url">① 자료 주소(URL)</label>
      <input id="url" type="url" placeholder="https://...">
      <div class="or">또는</div>
      <label for="text">② 자료 본문 붙여넣기</label>
      <textarea id="text" rows="10" placeholder="뉴스 기사, 블로그 글, SNS 글 등을 붙여넣으세요."></textarea>
      <label for="claim">③ 특정 문장만 검증하고 싶다면 (선택)</label>
      <textarea id="claim" rows="3" placeholder="예: 2025년에 국내 전기차 판매량은 전년보다 20% 증가했다."></textarea>
      <button id="check">검증 시작</button>
      <p class="hint">※ 원문 전체보다 핵심 주장 1~2개를 직접 넣으면 더 정확하게 확인할 수 있습니다.</p>
    </section>

    <section id="status" class="status hidden"></section>
    <section id="result" class="result hidden"></section>

    <footer>
      <p><b>주의:</b> 자동 판정은 참고용입니다. 검색 결과 제목이나 요약문만 보고 사실 여부를 확정하지 않으며, 최종적으로 원문 출처를 직접 확인해야 합니다.</p>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
